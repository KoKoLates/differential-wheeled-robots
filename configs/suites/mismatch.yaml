name: mismatch
description: "Model mismatch: actuator lag and wheel slip on the figure-eight."
seeds: [0]
maps: [map02]
scenarios:
  - scenario: nominal
    label: actuator_lag
    sweep: {plant.tau_v: [0.0, 0.1, 0.2, 0.3], plant.tau_omega: [0.0, 0.1, 0.2]}
  - scenario: nominal
    label: slip
    sweep: {plant.slip: [0.0, 0.05, 0.1, 0.2]}
controllers: [pid, pure_pursuit]
